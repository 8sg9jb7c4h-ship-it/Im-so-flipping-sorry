<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff3366;
            --primary-glow: rgba(255, 51, 102, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #2b1055 0%, #7597de 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Animated Heart Particles */
        .heart-particle {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.6;
            animation: floatUp 10s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Main Glass Card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.5px solid var(--glass-border);
            border-radius: 32px;
            padding: 45px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 10;
            text-align: center;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.1s ease, opacity 0.5s ease;
        }

        .emoji-badge {
            font-size: 4.5rem;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .popup-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 24px;
            margin: 0 auto 20px auto;
            display: none;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        h1 {
            color: var(--text);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 28px;
            line-height: 1.35;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: -0.5px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 56px;
            position: relative;
        }

        button {
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.3px;
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff3366 0%, #ff6b8b 100%);
            color: white;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .yes-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        .no-btn {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Glass Input Box */
        .msg-box {
            width: 100%;
            height: 100px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 18px;
            font-size: 1rem;
            color: white;
            outline: none;
            resize: none;
            margin-top: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .msg-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .msg-box:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .send-btn {
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="heartContainer"></div>

    <audio id="wompSound" src="https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3" preload="auto"></audio>

    <div class="card" id="card">
        
        <img id="sadImage" class="popup-img" src="https://i.imgflip.com/1ur9b0.jpg" alt="Sad reaction">

        <div id="q1" class="question-step fade-in">
            <div class="emoji-badge">🥺</div>
            <h1>Hello, are you mad at me?</h1>
            <div class="btn-container">
                <button class="yes-btn" onclick="nextQuestion(1, 'yes')">Yes</button>
                <button class="no-btn" onclick="nextQuestion(1, 'no')">No</button>
            </div>
        </div>

        <div id="q2" class="question-step hidden">
            <div class="emoji-badge" id="q2-emoji">🤔</div>
            <h1 id="q2-title">Am I dumb?</h1>
            <div class="btn-container">
                <button class="yes-btn" onclick="nextQuestion(2, 'yes')">Yes</button>
                <button class="no-btn" onclick="nextQuestion(2, 'no')">No</button>
            </div>
        </div>

        <div id="q3" class="question-step hidden">
            <div class="emoji-badge" id="q3-emoji">💭</div>
            <h1 id="q3-title">Do you believe I understood why I was wrong?</h1>
            <div class="btn-container">
                <button class="yes-btn" onclick="nextQuestion(3, 'yes')">Yes</button>
                <button class="no-btn" onclick="nextQuestion(3, 'no')">No</button>
            </div>
        </div>

        <div id="q4" class="question-step hidden">
            <div class="emoji-badge" id="q4-emoji">❤️</div>
            <h1 id="q4-title">Can you forgive me?</h1>
            <div class="btn-container">
                <button class="yes-btn" onclick="finishQuiz()">Yes ❤️</button>
                <button id="dodgingNoBtn" class="no-btn" onmouseover="triggerNoEffects()" onclick="triggerNoEffects()">No 😜</button>
            </div>
        </div>

        <div id="finalResult" class="question-step hidden">
            <div class="emoji-badge">💖</div>
            <h1>I love you, please don't hold a grudge on me, I can be dumb 😔</h1>
            
            <textarea id="userMsg" class="msg-box" placeholder="Write a message back to me..."></textarea>
            <button class="send-btn" onclick="sendToWhatsApp()">Send to my WhatsApp 💬</button>
        </div>

    </div>

    <script>
        // Generate Floating Background Hearts
        const heartContainer = document.getElementById('heartContainer');
        const heartEmojis = ['💖', '💕', '✨', '🌸', '💘'];
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.animationDuration = `${6 + Math.random() * 6}s`;
            heart.style.animationDelay = `${Math.random() * 5}s`;
            heartContainer.appendChild(heart);
        }

        // 3D Tilt Effect on Mouse Move
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        const wompSound = document.getElementById('wompSound');
        const sadImage = document.getElementById('sadImage');

        function triggerNoEffects() {
            wompSound.currentTime = 0;
            wompSound.play().catch(e => console.log("Audio play allowed on user click"));

            sadImage.style.display = 'block';

            const noBtn = document.getElementById('dodgingNoBtn');
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        function nextQuestion(currentQ, answer) {
            sadImage.style.display = 'none';

            const currentElement = document.getElementById(`q${currentQ}`);
            const nextElement = document.getElementById(`q${currentQ + 1}`);

            currentElement.classList.add('hidden');
            nextElement.classList.remove('hidden');
            nextElement.classList.add('fade-in');

            if (currentQ === 1) {
                if (answer === 'yes') {
                    document.getElementById('q2-emoji').innerText = '😔';
                } else {
                    document.getElementById('q2-emoji').innerText = '🎉';
                    document.getElementById('q2-title').innerText = 'YAYYYY! Am I dumb?';
                }
            } else if (currentQ === 2) {
                if (answer === 'no') {
                    document.getElementById('q3-title').innerText = 'whyyyy did you lie 😂 Do you believe I understood why I was wrong?';
                } else {
                    document.getElementById('q3-title').innerText = 'ik I love you ❤️ Do you believe I understood why I was wrong?';
                }
            } else if (currentQ === 3) {
                if (answer === 'yes') {
                    document.getElementById('q4-title').innerText = 'Thank you for trusting me 🥺 Can you forgive me?';
                } else {
                    document.getElementById('q4-title').innerText = 'I\'m sorry if I made you think that 💔 Can you forgive me?';
                }
            }
        }

        function finishQuiz() {
            document.getElementById('q4').classList.add('hidden');
            sadImage.style.display = 'none';

            const finalScreen = document.getElementById('finalResult');
            finalScreen.classList.remove('hidden');
            finalScreen.classList.add('fade-in');

            // Trigger Confetti Explosion
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function sendToWhatsApp() {
            const msg = document.getElementById('userMsg').value;
            // Replace with your real phone number including country code (e.g. 11234567890)
            const phoneNumber = "YOUR_PHONE_NUMBER_HERE"; 
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
